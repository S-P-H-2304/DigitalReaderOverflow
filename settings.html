<!DOCTYPE html>
<html lang="es" data-chapter="1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2F3C46">
    <title>Configuración</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/styles.css">
    <!-- Theme Loader -->
    <script>
        const savedChapter = localStorage.getItem('activeChapter');
        if (savedChapter) document.documentElement.setAttribute('data-chapter', savedChapter);
    </script>
</head>
<body>
    <header class="header">
        <button type="button" class="add-publish" id="overlay-publish" aria-label="Volver atrás">
            <svg class="close-overlay" viewBox="0 0 20 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0.439341 9.9853C-0.146446 10.5711 -0.146446 11.5208 0.43934 12.1066L9.98528 21.6526C10.5711 22.2383 11.5208 22.2383 12.1066 21.6526C12.6924 21.0668 12.6924 20.117 12.1066 19.5312L3.62132 11.046L12.1066 2.56068C12.6924 1.97489 12.6924 1.02514 12.1066 0.439357C11.5208 -0.14643 10.5711 -0.14643 9.98528 0.439357L0.439341 9.9853ZM19.5 11.046L19.5 9.54596L1.5 9.54596L1.5 11.046L1.5 12.546L19.5 12.546L19.5 11.046Z" fill="#D4DBE4"/>
            </svg>
        </button>
    </header>
    <main class="settings-container">
        <article class="profile-info-settings">
            <div class="profile-info-settings-pic-name">
                <img id="settings-user-pic" class="profile-settings-pic" src="Images/default-avatar.svg" alt="Foto de perfil" referrerpolicy="no-referrer">
                <h1 id="settings-user-header">Usuario</h1>
            </div>
        </article>
        <article class="settings-panels">
            <div class="community-card-cta-container" id="gap-settings">
                <div class="settings-panels-content" data-field="username">
                    <h2>Username</h2>
                    <div class="settings-icon-container">
                        <p>—</p>
                        <svg class="settings-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                        </svg>
                    </div>
                </div>
                <div class="settings-panels-content" data-field="bio">
                    <h2>Descripción</h2>
                    <div class="settings-icon-container">
                        <p style="max-width: 11rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">—</p>
                        <svg class="settings-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="community-card-cta-container" id="gap-settings">
                <div class="settings-panels-content" data-field="nombres">
                    <h2>Nombres</h2>
                    <div class="settings-icon-container">
                        <p>—</p>
                        <svg class="settings-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                        </svg>
                    </div>
                </div>
                <div class="settings-panels-content" data-field="apellidos">
                    <h2>Apellidos</h2>
                    <div class="settings-icon-container">
                        <p>—</p>
                        <svg class="settings-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="community-card-cta-container" id="gap-settings">
                <div class="settings-panels-content" data-field="email">
                    <h2>Email</h2>
                    <div class="settings-icon-container">
                        <p>—</p>
                        <svg class="settings-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                        </svg>
                    </div>
                </div>
                <div class="settings-panels-content" data-field="password">
                    <h2>Contraseña</h2>
                    <div class="settings-icon-container">
                        <p>*******</p>
                        <svg class="settings-icon" id="margin-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="community-card-cta-container" id="gap-settings">
                <div class="settings-panels-content">
                    <h2>Notificaciones</h2>
                    <label class="toggle-switch" aria-label="Activar notificaciones">
                        <input type="checkbox" class="toggle-input" id="notifications-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </article>
        <!-- Pop up para editar datos de configuración -->
        <div class="confirm-backdrop" id="edit-backdrop">
            <article class="confirm-overlay-container">
                <div class="confirm-overlay-content">
                    <h2 id="edit-field-title">Editar campo</h2>
                    <div class="edit-input-wrapper">
                        <input type="text" id="edit-field-input" class="edit-modal-input" placeholder="Ingresa un nuevo valor" autocomplete="off" />
                    </div>
                    <div class="confirm-overlay-selection">
                        <div id="btn-cancelar-edit" style="cursor: pointer;">
                            <span>Cancelar</span>
                        </div>
                        <div class="confirm-overlay-close" id="btn-guardar-edit" style="cursor: pointer;">
                            <span>Guardar</span>
                        </div>
                    </div>
                </div>
            </article>
        </div>

        <div class="confirm-backdrop" id="logout-backdrop">
            <article class="confirm-overlay-container">
                <div class="confirm-overlay-content">
                    <h2>¿Estás seguro de que quieres cerrar sesión?</h2>
                    <div class="confirm-overlay-selection">
                        <div id="btn-cancelar" style="cursor: pointer;">
                            <span>Cancelar</span>
                        </div>
                        <div class="confirm-overlay-close" id="btn-confirmar-logout" style="cursor: pointer;">
                            <span>Cerrar sesión</span>
                        </div>
                    </div>
                </div>
            </article>
        </div>
        <footer>
            <div class="settings-icon-container" id="settings-padding">
                <h3>Cerrar Sesión</h3>
                <svg class="settings-icon" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0.21967 10.8269C0.512589 11.1193 0.987468 11.1196 1.28022 10.8269L6.05268 6.05345C6.34557 5.76056 6.34557 5.2858 6.05268 4.9929L1.28022 0.219467C0.987467 -0.0732518 0.512588 -0.072979 0.219669 0.219467C-0.0732243 0.512361 -0.0732242 0.988097 0.219669 1.28099L4.46186 5.52318L0.21967 9.76537C-0.0732234 10.0583 -0.0732234 10.534 0.21967 10.8269Z" fill="#D4DBE4"/>
                </svg>
            </div>
        </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="Scripts/motion.js"></script>
    <script src="Scripts/db.js"></script>
    <script src="Scripts/log-out.js"></script>
</body>
</html>
